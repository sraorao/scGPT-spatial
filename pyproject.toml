[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scgpt-spatial"
version = "1.0.0"
description = "scGPT-spatial (bowang-lab), packaged with compatibility fixes for current torch/numpy/scipy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "scgpt>=0.2.5",  # GeneVocab without torchtext (bowang-lab/scGPT@cebd6fa)
    "torch>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "scanpy",
    "anndata",
    "scikit-learn",
    "einops",
    "matplotlib",
    "tqdm",
    "typing-extensions",
]

[project.optional-dependencies]
flash = ["flash-attn<2"]

[tool.setuptools.packages.find]
include = ["scgpt_spatial*"]
